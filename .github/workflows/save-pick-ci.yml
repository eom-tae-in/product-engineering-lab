name: savePick CI

# projects/save-pick 하위가 바뀔 때만 돈다 — 이 저장소는 여러 프로젝트를 담는 랩이라
# 관계없는 변경으로 CI를 돌리지 않는다.
on:
  push:
    branches: [main]
    paths:
      - "projects/save-pick/**"
      - ".github/workflows/save-pick-ci.yml"
  pull_request:
    paths:
      - "projects/save-pick/**"
      - ".github/workflows/save-pick-ci.yml"

# 같은 브랜치에서 연달아 푸시하면 이전 실행을 취소한다.
concurrency:
  group: save-pick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 (Gradle · Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/save-pick/backend
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 통합 테스트가 Testcontainers로 실제 PostgreSQL 15를 띄운다. ubuntu-latest 러너에는
      # Docker가 이미 있어 별도 서비스 컨테이너를 선언하지 않는다.
      - name: 테스트
        run: ./gradlew test --no-daemon

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: projects/save-pick/backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: 프론트엔드 (typecheck · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/save-pick/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/save-pick/frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      # typecheck → lint → test. src/lib/errors.test.ts는 docs/11-api-spec.md 원문을
      # 읽어 오류 코드 카탈로그와 대조하므로(TC-117) 저장소 전체 체크아웃이 필요하다.
      - name: 검증
        run: npm run verify

      - name: 프로덕션 빌드
        run: npm run build
