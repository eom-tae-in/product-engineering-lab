services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: savepick
      POSTGRES_USER: savepick
      POSTGRES_PASSWORD: savepick
    ports:
      - "5432:5432"
    volumes:
      - savepick-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savepick -d savepick"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  savepick-postgres-data:
