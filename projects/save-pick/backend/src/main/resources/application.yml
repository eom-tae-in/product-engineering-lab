spring:
  application:
    name: save-pick-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:savepick}
    username: ${DB_USERNAME:savepick}
    password: ${DB_PASSWORD:savepick}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 14-project-structure.md §8 — G1 확정값은 상수로 박지 않고 설정으로 뺀다.
# 값을 바꾸려면 옆에 표시된 BR-###/FR-### 문서를 먼저 확인한다.
savepick:
  time-zone: Asia/Seoul                       # BR-028
  hold:
    ttl: PT10M                                # BR-007 선점 10분, 연장 없음
    expiring-soon-threshold: PT60S            # 06 U1 확정 (2026-09-03) — 만료 1분 전 안내
  payment:
    max-attempts: 3                           # BR-012
  order:
    customer-cancel-deadline: PT1H            # BR-018 픽업 시작 1시간 전
  pickup:
    open-time: "10:00"                        # BR-014
    close-time: "22:00"
    slot-unit: PT30M                          # 30분 단위 24슬롯
    default-slot-capacity: 20                 # BR-016
    reservation-close-before: PT30M           # BR-015
    selectable-days: 2                        # BR-013 D+0~D+1
    no-show-grace: PT30M                      # BR-021
  restriction:
    no-show-window-days: 30                   # BR-023
    no-show-threshold: 3
    restriction-days: 7
  auth:
    access-token-ttl: PT30M                   # 12번 §2.1
    refresh-session-ttl: P30D                 # FR-002
    login-fail-threshold: 5                   # 03 A3
    login-block-duration: PT10M
    # 12번 §5 P8 — 로컬 개발 기본값. 운영 배포 시 환경변수로 반드시 교체하고 커밋하지 않는다.
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-in-production-32bytes+}
  # 12번 §5 P7 — 관리자 계정은 API로 만들지 않는다. 운영에서 첫 관리자를 만드는 유일한 경로다.
  # 기본은 꺼짐(넷 다 비어 있음). 계정을 만든 뒤에는 네 값을 지우고 다시 배포한다.
  # 한쪽만 채우거나 형식이 틀리면 AdminBootstrapRunner가 기동을 거부한다.
  admin:
    bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      name: ${ADMIN_BOOTSTRAP_NAME:}
      phone: ${ADMIN_BOOTSTRAP_PHONE:}
  # BATCH-06 만료 데이터 정리의 보관 기간 (10번 §8 데이터 보존과 정리).
  # 주문·재고 원장(orders·stock_ledgers·order_status_histories·inventory_holds)은 보존 대상이라 항목이 없다.
  retention:
    expired-session: P7D                      # 10번 §8 auth_sessions expires_at < now - 7일
    login-attempt: P90D                       # 10번 §8 login_attempts 90일 경과 행 삭제 (BR-002)
    guest-cart: P7D                           # 10번 §8 게스트 장바구니 updated_at < now - 7일 (T-A3)
  stock:
    lock-timeout: PT3S                        # 13번 §3
  batch:
    hold-expiry:
      interval: PT30S                         # BATCH-01 (BR-008 1분 이내)
    product-closing:
      interval: PT30S                         # BATCH-02
    no-show:
      interval: PT3M                          # BATCH-03 (BR-021 5분 이내)
    stock-consistency-check:
      cron: "0 0 3 * * *"                     # BATCH-04 매일 03:00 (11번 §11, 13번 §9.1)
    pickup-slot-provision:
      cron: "0 5 0 * * *"                     # BATCH-05 매일 00:05 (+ 기동 시 1회)
    data-retention:
      cron: "0 0 4 * * *"                     # BATCH-06 매일 04:00 (11번 §11, 10번 §8)
